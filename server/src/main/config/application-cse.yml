###############################################################################
# Profile: cse（唯一支持的华为 CSE 启用方式）
#   --spring.profiles.active=cse
#   或环境变量 SPRING_PROFILES_ACTIVE=cse
#
# 本 profile 会同时打开：
#   - spring.cloud.discovery.enabled
#   - spring.cloud.servicecomb.discovery.enabled   CSE 发现 + 注册本实例
# CSE 配置中心保持关闭。业务配置在 Nacos dataId=kkfileview.yml（需 nacos profile）；
# 无 Nacos 时走 ConfigConstants 代码默认。
#
# 请先把 CSE 注册中心地址、应用名、AK/SK 占位符换成实际值（勿提交真实密钥）。
# 不要与 nacos profile 一起激活：两个 ServiceRegistry 会在启动时 fail-fast。
# governance/router 自动配置被 HuaweiGovernanceImportFilter 跳过，预览 HTTP 不会被限流或改写。
# 不能从 POM 排除这两条传递依赖：CSE DiscoveryAutoConfiguration 的 Bean 实现了
# router Canary/ZoneAware 与 governance AuthenticationAdapter 接口。
###############################################################################

spring:
  cloud:
    discovery:
      enabled: true
    servicecomb:
      discovery:
        enabled: true
      config:
        enabled: false
