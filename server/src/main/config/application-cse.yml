###############################################################################
# Profile: cse
# 启用方式：--spring.profiles.active=cse
# 或环境变量 SPRING_PROFILES_ACTIVE=cse
#
# 请先把 CSE 注册中心地址、应用名、AK/SK 占位符换成实际值（勿提交真实密钥）。
# 该 profile 只打开华为 ServiceComb CSE 注册中心，不会打开 Nacos。
# Spring Cloud 同时只能有一个 ServiceRegistry：不要与 nacos profile 一起用于注册。
###############################################################################

spring:
  cloud:
    discovery:
      enabled: true
    servicecomb:
      discovery:
        enabled: true
      config:
        enabled: false
