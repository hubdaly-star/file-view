###############################################################################
# Profile: nacos（唯一支持的 Nacos 启用方式）
#   --spring.profiles.active=nacos
#   或环境变量 SPRING_PROFILES_ACTIVE=nacos
#
# 本 profile 会同时打开：
#   - spring.cloud.discovery.enabled              总开关
#   - spring.cloud.nacos.config.enabled
#     + spring.config.import（optional:nacos:...） 配置中心，连不上也不阻止启动
#   - spring.cloud.nacos.discovery.enabled
#     + register-enabled=true                     发现 + 向 Nacos 注册本实例
#
# 默认不启用 Nacos；必须显式加上述 profile。不要只改 enabled。
# 不要与 cse profile 一起激活：两个 ServiceRegistry 会在启动时 fail-fast。
#
# ---------- 已发布到本机 Nacos 的业务配置（source of truth，本 profile 下优先于本地 YAML）----------
# Nacos Server 2.5.5 standalone；认证关闭。
#   启动：在 Nacos 安装目录 bin 下执行  startup.cmd -m standalone
#         （Windows 请先把 JAVA_HOME 指到 JDK 21，例如 Temurin 21）
#   控制台：http://127.0.0.1:8848/nacos
#   dataId：kkfileview.yml
#   group：DEFAULT_GROUP
#   namespace showName：dev
#   namespace ID（tenant）：4529b5c0-a7c0-4891-b735-a1c7d0bc0a8e
#   public 为空；切回 public 时把 NACOS_NAMESPACE 设成空字符串
#   type：yaml
# 可用环境变量覆盖：NACOS_CONFIG_DATA_ID / NACOS_CONFIG_GROUP / NACOS_CONFIG_FILE_EXTENSION
#   / NACOS_SERVER_ADDR / NACOS_NAMESPACE / NACOS_USERNAME / NACOS_PASSWORD（勿提交真实密码）
#
# 同名 key：nacos profile 下以 Nacos kkfileview.yml 为 source of truth。
# ConfigRefreshComponent 在此 profile 下从 Environment 读配置并跳过本地 YAML 热加载覆盖。
# 无 nacos profile 时本地 application.yml 只有启动/连接默认值，业务键走 ConfigConstants。
###############################################################################

spring:
  cloud:
    discovery:
      enabled: true
    nacos:
      config:

        # Nacos 配置中心
        enabled: true
      discovery:

        # Nacos 服务注册与发现（enabled 与 register-enabled 一起打开）
        enabled: true
        register-enabled: true
  config:
    # 拉取 Nacos 上已发布的 YAML（dataId=kkfileview.yml）。optional：连不上 Nacos 也不阻止启动。
    import: "optional:nacos:${NACOS_CONFIG_DATA_ID:kkfileview.yml}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true"
