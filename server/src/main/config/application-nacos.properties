###############################################################################
# Profile: nacos
# 启用方式：--spring.profiles.active=nacos
# 或环境变量 SPRING_PROFILES_ACTIVE=nacos
#
# 请先把 Nacos 地址 / namespace / group / data-id / 账号换成实际值（勿提交真实密码）。
# 该 profile 只打开 Nacos，不会打开华为 CSE。
###############################################################################

spring.cloud.discovery.enabled = true

# Nacos 配置中心
spring.cloud.nacos.config.enabled = true
spring.config.import = optional:nacos:${NACOS_CONFIG_DATA_ID:kkfileview.properties}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true

# Nacos 服务注册与发现
spring.cloud.nacos.discovery.enabled = true
spring.cloud.nacos.discovery.register-enabled = true
