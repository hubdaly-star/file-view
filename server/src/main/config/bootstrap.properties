###############################################################################
# Optional bootstrap (Huawei CSE docs historically put registry address here).
#
# Spring Cloud Alibaba 2025.0.x still accepts bootstrap; 2025.1.x removes it.
# This file is inert unless spring-cloud-starter-bootstrap is on the classpath
# AND spring.cloud.bootstrap.enabled=true.
#
# Default: do not enable bootstrap. Prefer application.properties +
# spring.config.import for Nacos, and application-cse.properties for CSE.
###############################################################################

spring.cloud.bootstrap.enabled = false

# Nacos (only used when bootstrap is enabled)
spring.cloud.nacos.config.enabled = false
spring.cloud.nacos.discovery.enabled = false
spring.cloud.nacos.server-addr = ${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.username = ${NACOS_USERNAME:}
spring.cloud.nacos.password = ${NACOS_PASSWORD:}
spring.cloud.nacos.config.namespace = ${NACOS_NAMESPACE:}
spring.cloud.nacos.config.group = ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}

# Huawei CSE registry (only used when bootstrap is enabled)
spring.cloud.servicecomb.discovery.enabled = false
spring.cloud.servicecomb.discovery.address = ${CSE_REGISTRY_ADDRESS:http://127.0.0.1:30100}
spring.cloud.servicecomb.credentials.enabled = ${CSE_CREDENTIALS_ENABLED:false}
spring.cloud.servicecomb.credentials.accessKey = ${CSE_ACCESS_KEY:}
spring.cloud.servicecomb.credentials.secretKey = ${CSE_SECRET_KEY:}
spring.cloud.servicecomb.credentials.akskCustomCipher = default
spring.cloud.servicecomb.credentials.project = ${CSE_PROJECT:cn-north-4}
