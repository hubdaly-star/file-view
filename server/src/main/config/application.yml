###############################################################################
# Boot + cloud connection only. Do not put preview/business keys here.
#
# Source of truth for office, pdf, cache, trust.host, watermark, media, ftp,
# aes, file types, and the rest of the preview settings:
#   Nacos 2.5.5 console: http://127.0.0.1:8848/nacos
#   dataId=kkfileview.yml, group=DEFAULT_GROUP, type=yaml
#   namespace showName=dev, ID=4529b5c0-a7c0-4891-b735-a1c7d0bc0a8e
#
# Default start (java -jar / IDE, no extra args) activates profile nacos.
# That loads application-nacos.yml, which:
#   - sets spring.cloud.nacos.config.enabled=true
#   - imports optional:nacos:kkfileview.yml from namespace dev (ID above)
# ConfigRefreshComponent then skips local YAML overwrite and reads Environment.
# LocalOfficeUtils / OfficePluginManager read office.home from Environment
# (Nacos kkfileview.yml), not this file. nacos profile 下业务配置以 Nacos 为准。
# 不要只改 enabled。
#
# CLI --spring.profiles.active / SPRING_PROFILES_ACTIVE 会替换这个默认值：
#   cse   华为 CSE 发现（Nacos discovery 关闭，避免双注册；配置中心仍是 Nacos）
#   none  关闭 Nacos / CSE。本文件不含业务键，走 ConfigConstants / @Value 默认
# 不要同时激活 nacos 和 cse：两个 discovery.enabled 同时为 true 会 fail-fast。
#
# 版本：Spring Cloud Alibaba 2025.0.0.0 + Spring Cloud Huawei 1.11.15-2025.0.x
# Nacos 配置用 spring.config.import（写在 application-nacos.yml / application-cse.yml）。
# 不使用 bootstrap。
###############################################################################

spring:
  application:
    name: "${SPRING_APPLICATION_NAME:kkfileview}"
  profiles:
    # Plain java -jar / IDE start. Override with --spring.profiles.active=cse or none.
    active: nacos
  # Nacos 配置导入写在 application-nacos.yml / application-cse.yml（dataId=kkfileview.yml）。
  servlet:
    multipart:
      # Servlet 上传上限（框架启动即生效；业务侧同名键在 Nacos kkfileview.yml）
      max-file-size: "500MB"
      max-request-size: "500MB"
  freemarker:
    # Templates live under classpath:/web/*.ftl (not Boot's classpath:/templates/)
    template-loader-path: "classpath:/web/"
    cache: false
    charset: UTF-8
    check-template-location: true
    content-type: text/html
    expose-request-attributes: true
    expose-session-attributes: true
    request-context-attribute: request
    suffix: .ftl
  cloud:
    discovery:
      # 总开关：false 时不启用 DiscoveryClient。nacos / cse profile 会把它设为 true
      enabled: false
    nacos:

      # ---------- Nacos 公共连接（config / discovery 共用；仅地址/账号可用环境变量覆盖）----------
      # 默认连本机 Nacos 2.5.5 的 dev 命名空间（showName=dev，ID 见 namespace）。
      # public 为空；SCA 2025.0.x 若改回 public / 空 namespace，Nacos Server 需 3.x。
      server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
      username: "${NACOS_USERNAME:}"
      password: "${NACOS_PASSWORD:}"
      config:

        # ---------- Nacos 配置中心（本文件默认关闭；默认 nacos profile 会打开）----------
        # 与控制台已发布配置对齐：dataId=kkfileview.yml（YAML），group=DEFAULT_GROUP。
        # file-extension=yaml 表示按 YAML 解析；实际拉取的 dataId 由
        # application-nacos.yml / application-cse.yml 的 spring.config.import
        # 指定为 kkfileview.yml。
        enabled: false
        import-check:
          enabled: false
        fail-fast: false
        refresh-enabled: true
        namespace: "${NACOS_NAMESPACE:4529b5c0-a7c0-4891-b735-a1c7d0bc0a8e}"
        group: "${NACOS_CONFIG_GROUP:DEFAULT_GROUP}"
        file-extension: "${NACOS_CONFIG_FILE_EXTENSION:yaml}"
        prefix: "${NACOS_CONFIG_PREFIX:kkfileview}"
      discovery:
        # ---------- Nacos 服务注册 / 发现（本文件默认关闭；默认 nacos profile 会打开）----------
        enabled: false
        register-enabled: false
        fail-fast: false
        namespace: "${NACOS_NAMESPACE:4529b5c0-a7c0-4891-b735-a1c7d0bc0a8e}"
        group: "${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}"
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        username: "${NACOS_USERNAME:}"
        password: "${NACOS_PASSWORD:}"
        metadata:
          version: "${NACOS_DISCOVERY_METADATA_VERSION:5.0.3}"
    servicecomb:
      discovery:

        # ---------- 华为云 ServiceComb CSE 注册中心（默认关闭；cse profile 会打开）----------
        enabled: false
        address: "${CSE_REGISTRY_ADDRESS:http://127.0.0.1:30100}"
        appName: "${CSE_APPLICATION:kkfileview}"
        serviceName: "${CSE_SERVICE_NAME:kkfileview}"
        version: "${CSE_SERVICE_VERSION:5.0.3}"
        watch: false
        healthCheckInterval: "15"
      config:
        enabled: false
      dashboard:
        enabled: false
      webmvc:
        rateLimiting:
          enabled: false
        identifierRateLimiting:
          enabled: false
        circuitBreaker:
          enabled: false
        bulkhead:
          enabled: false
        contextMapper:
          enabled: false
        publicKey:
          consumerEnabled: false
          providerEnabled: false
      service:
        name: "${CSE_SERVICE_NAME:kkfileview}"
        application: "${CSE_APPLICATION:kkfileview}"
        environment: "${CSE_ENVIRONMENT:production}"
        version: "${CSE_SERVICE_VERSION:5.0.3}"
      credentials:
        enabled: "${CSE_CREDENTIALS_ENABLED:false}"
        accessKey: "${CSE_ACCESS_KEY:}"
        secretKey: "${CSE_SECRET_KEY:}"
        akskCustomCipher: default
        project: "${CSE_PROJECT:cn-north-4}"

server:
  port: "${KK_SERVER_PORT:8012}"
  servlet:
    context-path: "${KK_CONTEXT_PATH:/}"
    encoding:
      charset: utf-8
  compression:
    enabled: true
    min-response-size: "2048"
    mime-types: "application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain,font/woff,application/font-woff,font/eot,image/svg+xml,image/x-icon"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true
